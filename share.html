<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공유 — 여덟글자</title>
<meta name="description" content="여덟글자에서 만든 카드와 초대를 여는 자리예요.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://yeodeol.kr/share">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#35714F">
<meta property="og:type" content="website">
<meta property="og:site_name" content="여덟글자">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://yeodeol.kr/share">
<meta property="og:image" content="https://yeodeol.kr/assets/img/og-share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/css/style.css?v=20261118a">
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-head"></header>

<main class="wrap" id="main">
  <div id="shareBody" style="max-width:640px;margin:0 auto;"></div>
</main>

<footer class="site-foot"></footer>
<nav class="tabbar" aria-label="하단 메뉴"></nav>

<script type="module">
import { boot, decodeShare, getProfile, store, toast, EL_IMG, trackEvent } from '/assets/js/app.js?v=20261118a';
import { fourPillars, dayPillarIndex, coupleWeather, tenGod, TEN_GODS,
         fmt, STEMS, BRANCHES, ELEMENTS, ELEMENTS_HANJA } from '/assets/js/saju.js?v=20261118a';
import { WX_STATE, LENS, LENS_LINE, YEAR_LINE } from '/assets/js/content2.js?v=20261118a';
import { EL_THEME, STEM_DEF } from '/assets/js/content.js?v=20261118a';

const ctx = boot(null);
const { theme } = ctx;
const body = document.getElementById('shareBody');
const STEM_EL = [0,0,1,1,2,2,3,3,4,4];

const data = decodeShare(location.hash.slice(1));
if (data) trackEvent('invite_opened');

function ctaFooter(msg = '당신의 여덟 글자도 여기 있어요'){
  return `<div style="text-align:center;margin-top:26px;">
    <p style="font-size:13.5px;color:var(--sub);margin:0 0 12px;">${msg}</p>
    <a class="btn btn-primary" href="/saju">내 여덟 글자 만들기 · 무료</a>
    <p style="font-size:11.5px;color:var(--mute);margin:12px 0 0;">회원가입 없음 · 입력한 정보는 내 기기에만 남아요</p>
  </div>`;
}
function card(inner){
  return `<section class="block" style="margin-top:30px;"><div class="panel" style="padding:30px 28px;">${inner}</div>${ctaFooter()}</section>`;
}

if (!data) {
  body.innerHTML = `<section class="block" style="margin-top:40px;text-align:center;">
    <h1 class="serif" style="font-size:24px;margin:0 0 10px;">이 링크는 읽을 수 없어요</h1>
    <p style="color:var(--sub);font-size:14px;">링크가 잘렸거나 오래되었을 수 있어요.</p>
    ${ctaFooter('대신, 당신의 이야기를 시작해 볼까요')}
  </section>`;
} else if (data.t === 'today') {
  const th = EL_THEME[data.el] ?? theme;
  body.innerHTML = card(`
    <div style="text-align:center;">
      <img src="${EL_IMG[data.el] ?? EL_IMG[0]}" alt="" style="width:min(300px,72%);border-radius:16px;box-shadow:var(--shadow-lg);margin:0 auto 18px;">
      <p style="font-size:12.5px;color:var(--mute);margin:0 0 4px;">${data.y}. ${String(data.mo).padStart(2,'0')}. ${String(data.d).padStart(2,'0')} · 오늘의 색</p>
      <p class="serif" style="font-size:40px;font-weight:300;letter-spacing:.05em;margin:0 0 10px;color:${th.text};">${data.gz}</p>
      <p class="serif" style="font-size:19px;line-height:1.6;margin:0 0 8px;">${th.title.join(' ')}</p>
      <p style="font-size:14px;color:var(--sub);margin:0;">${th.sub}</p>
      <p class="gyeol-action" style="margin-top:10px;">${th.action}</p>
    </div>`);
} else if (data.t === 'saju') {
  const def = STEM_DEF[data.ds] || STEM_DEF[0];
  body.innerHTML = card(`
    <p style="font-size:12.5px;color:var(--mute);text-align:center;margin:0 0 14px;">누군가의 여덟 글자예요 · 이름은 담기지 않아요</p>
    <p class="serif" style="text-align:center;font-size:38px;font-weight:300;letter-spacing:.04em;line-height:1.5;margin:0 0 14px;">${data.p[0]} ${data.p[1]}<br>${data.p[2]} ${data.p[3]}</p>
    <p class="serif" style="text-align:center;font-size:19px;margin:0 0 8px;">「${def.type}」</p>
    <p style="text-align:center;font-size:14px;color:var(--sub);margin:0 0 16px;">${def.line}</p>
    <div style="display:flex;justify-content:center;gap:8px;">
      ${data.c.map((n,i)=>`<span style="font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:#fff;">${ELEMENTS[i]} ${n||'·'}</span>`).join('')}
    </div>`);
} else if (data.t === 'year') {
  body.innerHTML = card(`
    <div style="text-align:center;">
      <p style="font-size:12.5px;color:var(--mute);margin:0 0 6px;">${data.y}년 · 올해의 한 문장</p>
      <p class="serif" style="font-size:52px;font-weight:300;letter-spacing:.05em;margin:0 0 14px;">${data.gz}</p>
      <p class="serif" style="font-size:20px;line-height:1.7;margin:0;">${data.line}</p>
    </div>`);
} else if (data.t === 'gh') {
  const st = WX_STATE[data.s] || WX_STATE.mist;
  body.innerHTML = card(`
    <div style="text-align:center;">
      <p style="font-size:12.5px;color:var(--mute);margin:0 0 12px;">둘의 날씨 · ${LENS[data.l] || '연인'} 사이</p>
      <div style="font-size:40px;margin-bottom:6px;">${st.icon}</div>
      <p class="serif" style="font-size:30px;font-weight:300;letter-spacing:.06em;margin:0 0 6px;">${data.a}&nbsp;&nbsp;${data.b}</p>
      <p class="serif" style="font-size:20px;margin:0 0 14px;">— ${st.name} —</p>
      <p style="font-size:14.5px;line-height:1.9;color:var(--sub);margin:0 0 10px;">${st.line}</p>
      <p class="gyeol-action">이번 주에 한 가지 — ${st.week}</p>
      <p style="font-size:11.5px;color:var(--mute);margin-top:14px;">점수는 없어요 · 판정 대신 설명해요</p>
    </div>`);
} else if (data.t === 'invite') {
  renderInvite(data);
} else {
  body.innerHTML = card(`<p style="text-align:center;color:var(--sub);">알 수 없는 카드예요.</p>`);
}

/* ── 이어보기 링크 (A-06) ── */
function renderInvite(inv){
  if (inv.x && Date.now() > inv.x) {
    body.innerHTML = `<section class="block" style="margin-top:40px;text-align:center;">
      <h1 class="serif" style="font-size:24px;margin:0 0 10px;">이 초대는 시간이 지났어요</h1>
      <p style="color:var(--sub);font-size:14px;line-height:1.9;">초대 링크는 7일 동안만 살아 있어요.<br>보낸 사람에게 새 링크를 부탁해 보세요.</p>
      ${ctaFooter('기다리는 동안, 당신의 여덟 글자를 먼저 만들어 볼까요')}
    </section>`;
    return;
  }
  const who = inv.n ? `${inv.n} 님이` : '누군가';
  body.innerHTML = `<section class="block" style="margin-top:30px;">
    <div class="panel" style="padding:30px 28px;">
      <p style="font-size:12.5px;color:var(--mute);text-align:center;margin:0 0 6px;">여덟글자 · 둘의 날씨 초대</p>
      <h1 class="serif" style="font-size:22px;text-align:center;margin:0 0 8px;">${who} 두 사람의 날씨를<br>함께 보고 싶어 해요</h1>
      <p style="text-align:center;font-size:13.5px;color:var(--sub);line-height:1.9;margin:0 0 20px;">
        생년월일을 넣으면 이 화면에서 바로 결과가 떠요.<br>
        입력한 정보는 <b>이 기기에만</b> 남고, 상대에게 그대로 넘어가지 않아요.</p>
      <div class="form-card" style="max-width:440px;">
        <div class="f-field"><label for="iY">생년월일</label>
          <input id="iY" type="number" inputmode="numeric" placeholder="1995" min="1900" max="2100" style="max-width:86px;"><span style="color:var(--mute)">년</span>
          <input id="iM" type="number" inputmode="numeric" placeholder="5" min="1" max="12" style="max-width:56px;"><span style="color:var(--mute)">월</span>
          <input id="iD" type="number" inputmode="numeric" placeholder="20" min="1" max="31" style="max-width:56px;"><span style="color:var(--mute)">일</span>
        </div>
        <button class="btn btn-primary" id="btnGo" style="width:100%;">둘의 날씨 보기 · 무료</button>
      </div>
      <div id="inviteResult" style="margin-top:22px;"></div>
    </div>
  </section>`;
  document.getElementById('btnGo').onclick = () => {
    const y = +document.getElementById('iY').value, mo = +document.getElementById('iM').value, d = +document.getElementById('iD').value;
    if (!y || !mo || !d) { toast('생년월일을 확인해 주세요'); return; }
    const myDi = dayPillarIndex(y, mo, d);
    const my = { stem: myDi % 10, branch: myDi % 12 };
    const themDi = dayPillarIndex(inv.b.y, inv.b.mo, inv.b.d);
    const them = { stem: themDi % 10, branch: themDi % 12 };
    const w = coupleWeather(my, them);
    const st = WX_STATE[w.state];
    document.getElementById('inviteResult').innerHTML = `
      <div style="text-align:center;border-top:1px solid var(--line2);padding-top:22px;">
        <div style="font-size:38px;margin-bottom:4px;">${st.icon}</div>
        <p class="serif" style="font-size:28px;font-weight:300;letter-spacing:.06em;margin:0 0 4px;">${fmt.gz(my.stem,my.branch)}&nbsp;&nbsp;${fmt.gz(them.stem,them.branch)}</p>
        <p class="serif" style="font-size:19px;margin:0 0 12px;">— ${st.name} —</p>
        <p style="font-size:14.5px;line-height:1.9;color:var(--sub);margin:0 0 10px;">${st.line}</p>
        <p class="gyeol-action">이번 주에 한 가지 — ${st.week}</p>
      </div>
      ${ctaFooter('당신의 여덟 글자도 여기 있어요 — 방금 넣은 생일로 1분이면 돼요')}`;
    document.getElementById('inviteResult').scrollIntoView({ behavior:'smooth', block:'start' });
  };
}
</script>
</body>
</html>
