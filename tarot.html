<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타로 한 장 — 여덟글자</title>
<meta name="description" content="하루에 한 장, 일진에서 뽑는 오늘의 타로. 카드 스물두 장의 메시지를 사주의 결과 나란히 읽어요.">
<link rel="canonical" href="https://yeodeol.kr/tarot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#35714F">
<meta property="og:type" content="website">
<meta property="og:site_name" content="여덟글자">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="타로 한 장 — 여덟글자">
<meta property="og:description" content="하루에 한 장, 일진에서 뽑는 오늘의 타로. 카드 스물두 장의 메시지를 사주의 결과 나란히 읽어요.">
<meta property="og:url" content="https://yeodeol.kr/tarot">
<meta property="og:image" content="https://yeodeol.kr/assets/img/og-home.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-head"></header>

<main class="wrap" id="main">
  <section class="block" style="margin-top:26px;">
    <div class="sec-head"><h1>오늘의 카드</h1><span class="more" id="tarotDate"></span></div>
    <div class="panel" style="text-align:center;padding:34px 24px;">
      <img src="/assets/img/ins-tarot.webp" alt="" width="150" height="150" style="width:150px;border-radius:14px;margin:0 auto 16px;box-shadow:var(--shadow-lg);">
      <p class="serif" id="tName" style="font-size:24px;font-weight:600;margin:0 0 8px;"></p>
      <p id="tLine" style="font-size:14.5px;color:var(--sub);line-height:1.9;max-width:460px;margin:0 auto 10px;"></p>
      <p class="gyeol-action" id="tPair" style="max-width:460px;margin:0 auto;"></p>
      <p class="sec-note" style="margin-top:14px;">카드는 하루에 한 장이에요. 내일 아침이면 다른 카드가 와 있어요.</p>
    </div>
  </section>
  <section class="block">
    <div class="sec-head"><h2>스물두 장의 카드</h2><span class="more">메이저 아르카나</span></div>
    <p style="font-size:14px;color:var(--sub);line-height:1.95;max-width:680px;margin:0 0 16px;">
      타로의 큰 카드 스물두 장은 바보의 여행이라 불리는 하나의 이야기예요. 시작하는 바보에서
      완성의 세계까지, 사람이 지나는 스물두 개의 장면이라고 보면 돼요. 여덟글자는 이 카드를
      점괘가 아니라 오늘 하루를 바라보는 렌즈 하나로 씁니다. 좋은 카드와 나쁜 카드는 없어요.</p>
    <div class="tarot-grid" id="tGrid"></div>
  </section>
</main>

<footer class="site-foot"></footer>
<nav class="tabbar" aria-label="하단 메뉴"></nav>

<script type="module">
import { boot, todayTarot } from '/assets/js/app.js?v=20261120a';
import { TAROT } from '/assets/js/content.js?v=20261120a';
const ctx = boot(null);
const { t, mine } = ctx;
document.getElementById('tarotDate').textContent = `${t.y}년 ${t.mo}월 ${t.d}일 · ${t.gz}일`;
const card = todayTarot();
document.getElementById('tName').textContent = card.title;
document.getElementById('tLine').textContent = card.line;
document.getElementById('tPair').textContent = mine
  ? `오늘의 일진 ${t.gz}와 나란히 — 카드가 건네는 오늘의 렌즈예요.`
  : '카드가 건네는 오늘의 렌즈예요. 좋은 카드도 나쁜 카드도 없어요.';
document.getElementById('tGrid').innerHTML = TAROT.map((c, i) => `
  <div class="tarot-cell" ${c[0]===card.title?'style="border-color:var(--brand);border-width:1.5px;"':''}>
    <b>${i}. ${c[0]}</b><p>${c[1]}</p>
  </div>`).join('');
</script>
<script defer src="https://choisijun.com/k1.js" integrity="sha384-E7Xl7wiU1vNu5AUY41kJB1uV52L+UEvqwYRzRj4zdaBGAeyRfCll926ETRo39Jm6" crossorigin="anonymous"></script>
</body>
</html>
