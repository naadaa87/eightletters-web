<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-head"></header>

<main class="wrap" id="main">
  <section class="block" style="margin-top:26px;">
    <div class="sec-head"><h2>지식 사전</h2><span class="more" id="dCount"></span></div>
    <p style="font-size:14px;color:var(--sub);line-height:1.95;max-width:680px;margin:0 0 6px;">
      명리 용어는 어렵게 태어난 말이 아니라 오래된 말일 뿐이에요. 여기 실린 풀이에는
      겁주는 문장이 없어요. 나쁜 글자도, 피해야 할 관계도 없다는 게 이 사전의 관점이에요.</p>
    <div class="dict-nav" id="dNav"></div>
    <div class="dict-list" id="dList"></div>
  </section>
</main>

<footer class="site-foot"></footer>
<nav class="tabbar" aria-label="하단 메뉴"></nav>

<script type="module">
import { boot } from '/assets/js/app.js?v=20261117b';
import { DICT } from '/assets/js/content3.js?v=20261117b';
boot(null);
const groups = ['전체', ...new Set(DICT.map(d => d.g))];
let cur = '전체';
function render(){
  document.getElementById('dNav').innerHTML = groups.map(g =>
    `<button class="pill ${g===cur?'on':''}" data-g="${g}">${g}</button>`).join('');
  document.querySelectorAll('#dNav .pill').forEach(b => b.onclick = () => { cur = b.dataset.g; render(); });
  const list = cur === '전체' ? DICT : DICT.filter(d => d.g === cur);
  document.getElementById('dCount').textContent = `${list.length}항목`;
  document.getElementById('dList').innerHTML = list.map(d =>
    `<div class="dict-item" id="${d.t}"><b>${d.t}</b><span class="h">${d.h}</span><p>${d.d}</p></div>`).join('');
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}
render();
</script>
</body>
</html>
